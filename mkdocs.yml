site_name: vLLM Doctor
site_description: Diagnostic tool for vLLM inference servers
site_url: https://docs.vllm.doctor/

theme:
  name: "zensical"
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  icon:
    repo: simple/github

repo_name: vllm-doctor/vllm-doctor
repo_url: https://github.com/vllm-doctor/vllm-doctor
edit_uri: ""

nav:
  - Introduction: "index.md"
  - Assessment: "assessment.md"
  - Commands:
      - diagnose: "commands/diagnose.md"
      - history: "commands/history.md"
      - migrate: "commands/migrate.md"
  - Rules:
      - Queue Pressure: "rules/queue-pressure.md"
      - Queue Latency: "rules/queue-latency.md"
      - KV Cache Pressure: "rules/kv-cache-pressure.md"
      - Preemption Pressure: "rules/preemption-pressure.md"
      - Low Throughput: "rules/low-throughput.md"
      - Error Rate: "rules/error-rate.md"
      - High TTFT: "rules/ttft-bottleneck.md"
      - High TPOT: "rules/tpot-bottleneck.md"
      - Prefix Cache Efficiency: "rules/prefix-cache-efficiency.md"
      - Replica Imbalance: "rules/replica-imbalance.md"
  - Configuration: "configuration.md"
  - Metrics: "metrics.md"
  - JSON Output: "json-output.md"
  - Glossary: "glossary.md"

markdown_extensions:
  - markdown.extensions.codehilite:
      guess_lang: false
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - attr_list

watch:
  - docs/

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vllm-doctor
