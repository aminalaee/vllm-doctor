[package]
name = "vllm-doctor"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Diagnostic tool for vLLM inference servers"
license = "Apache-2.0"
repository = "https://github.com/aminalaee/vllm-doctor"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dirs = "5"
figment = { version = "0.10", features = ["toml", "env"] }
owo-colors = "4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
terminal_size = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "uuid", "chrono"] }
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
uuid = { version = "1", features = ["v7", "serde"] }
unicode-width = "0.2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[[bin]]
name = "vllm-doctor"
path = "src/main.rs"

[lib]
name = "vllm_doctor"
path = "src/lib.rs"

[profile.release]
strip = true
lto = true
