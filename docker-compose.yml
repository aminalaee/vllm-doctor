services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: vllm-doctor
      POSTGRES_PASSWORD: vllm-doctor
      POSTGRES_DB: vllm-doctor
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vllm-doctor -d vllm-doctor"]
      interval: 2s
      timeout: 5s
      retries: 10
