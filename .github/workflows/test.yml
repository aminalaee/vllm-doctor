name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Smoke — version
        run: ./target/release/vllm-doctor --version
      - name: Smoke — diagnose Prometheus
        run: |
          python3 examples/mock/serve_metrics.py examples/mock/prometheus.json --port 8000 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          set +e
          ./target/release/vllm-doctor diagnose http://localhost:8000 --output json | tee /tmp/prometheus.json
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -gt 1 ]; then exit "$STATUS"; fi
          grep -q '"schema_version"' /tmp/prometheus.json
          grep -q '"metrics_source": "prometheus"' /tmp/prometheus.json
          grep -q '"engine": "vllm"' /tmp/prometheus.json
          grep -q '"replica_imbalance"' /tmp/prometheus.json
      - name: Smoke — diagnose direct scrape
        run: |
          python3 examples/mock/serve_metrics.py examples/mock/metrics.txt --port 8000 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          ./target/release/vllm-doctor diagnose http://localhost:8000/metrics --output json | tee /tmp/scrape.json
          grep -q '"schema_version"' /tmp/scrape.json
          grep -q '"metrics_source": "direct_scrape"' /tmp/scrape.json
      - name: Docs examples up to date
        run: ./scripts/check-docs.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vllm-doctor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm vllm-doctor:ci --version
          docker run --rm vllm-doctor:ci --help
