---
name: Test Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: "actions/checkout@v4"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: "Install dependencies"
        run: uv sync --all-groups
      - name: "Run linting checks"
        run: make lint
      - name: "Build package & docs"
        run: |
          make build
          make docs-build
      - name: "Run tests"
        run: make test

  docker:
    name: "Docker image"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v4"
      - name: "Set up Buildx"
        uses: docker/setup-buildx-action@v3
      - name: "Build image"
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vllm-doctor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "Smoke test (CLI runs)"
        run: |
          docker run --rm vllm-doctor:ci --version
          docker run --rm vllm-doctor:ci --help
      - name: "Install uv"
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: "Functional test (diagnose a served fixture)"
        run: |
          uv sync --all-groups
          uv run python scripts/serve_metrics.py tests/fixtures/prometheus/demo.json > /dev/null 2>&1 &
          sleep 2
          docker run --rm --network host vllm-doctor:ci diagnose http://localhost:8000 --output json | tee /tmp/out.json
          grep -q '"schema_version"' /tmp/out.json
          grep -q '"replica_imbalance"' /tmp/out.json
