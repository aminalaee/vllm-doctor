name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Smoke — version
        run: ./target/release/vllm-doctor --version
      - name: Smoke — diagnose fixture
        run: |
          python3 scripts/serve_metrics.py tests/fixtures/prometheus/demo.json --port 8000 &
          SERVER_PID=$!
          sleep 1
          ./target/release/vllm-doctor diagnose http://localhost:8000 --output json | tee /tmp/out.json
          kill $SERVER_PID
          grep -q '"schema_version"' /tmp/out.json
          grep -q '"replica_imbalance"' /tmp/out.json

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vllm-doctor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm vllm-doctor:ci --version
          docker run --rm vllm-doctor:ci --help