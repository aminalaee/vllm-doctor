name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/vllm-doctor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/vllm-doctor
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Smoke
        run: ./target/release/vllm-doctor --version
