[package]
name = "vllm-doctor"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Diagnostic tool for vLLM inference servers"
repository = "https://github.com/aminalaee/vllm-doctor"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
figment = { version = "0.10", features = ["toml", "env"] }
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[[bin]]
name = "vllm-doctor"
path = "src/main.rs"

[lib]
name = "vllm_doctor"
path = "src/lib.rs"

[profile.release]
strip = true
lto = true
